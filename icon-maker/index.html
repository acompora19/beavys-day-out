<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Out Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap">
<style>
:root{--bg:#EDE3CC;--fg:#2B2118}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1A1712;--fg:#EEE4CD;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1712;--fg:#EEE4CD;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
canvas{width:min(512px,100%);height:auto;border-radius:22%;box-shadow:0 4px 20px rgba(0,0,0,.2)}
p{margin:0;font-size:14px;opacity:.75}
</style>
</head><body>
<canvas id="c" width="1024" height="1024"></canvas>
<p id="status">Drawing…</p>
<script>
const S = 1024, cx = S / 2, cy = S / 2;
const c = document.getElementById("c"), g = c.getContext("2d");
const RED = "#B0432B", CREAM = "#F3EAD3", INK = "#2B2118", RING = "#3A2A1E";

function arcText(text, radius, startDeg, endDeg, color, size, flip) {
  g.save(); g.fillStyle = color; g.font = `${size}px "IM Fell English", serif`; g.textAlign = "center"; g.textBaseline = "middle";
  const widths = [...text].map(ch => g.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + (text.length - 1) * size * 0.14;
  const span = total / radius;                       // radians the text covers
  const mid = (startDeg + endDeg) / 2 * Math.PI / 180;
  let a = mid - (flip ? -span / 2 : span / 2);
  for (let i = 0; i < text.length; i++) {
    const w = widths[i] + (i ? size * 0.14 : 0);
    const half = (widths[i] / 2) / radius;
    a += flip ? -(w - widths[i]) / radius - half : (w - widths[i]) / radius + half;
    g.save(); g.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    g.rotate(a + (flip ? -Math.PI / 2 : Math.PI / 2));
    g.fillText(text[i], 0, 0); g.restore();
    a += flip ? -half : half;
  }
  g.restore();
}
function diamond(x, y, r, color) { g.save(); g.fillStyle = color; g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-r, -r, 2 * r, 2 * r); g.restore(); }

async function draw() {
  await document.fonts.load('80px "IM Fell English"'); await document.fonts.ready;
  const img = new Image(); img.src = "gear-fall.webp"; await img.decode();
  // ground
  g.fillStyle = RED; g.fillRect(0, 0, S, S);
  // disc with two rings, like the Almanac badge
  g.beginPath(); g.arc(cx, cy, 470, 0, Math.PI * 2); g.fillStyle = RING; g.fill();
  g.beginPath(); g.arc(cx, cy, 460, 0, Math.PI * 2); g.fillStyle = CREAM; g.fill();
  // paper grain
  const grain = g.createImageData(S, S); const d = grain.data;
  for (let i = 0; i < d.length; i += 4) { const v = 43 + Math.random() * 20; d[i] = v; d[i + 1] = v * 0.78; d[i + 2] = v * 0.55; d[i + 3] = Math.random() < 0.5 ? 10 : 0; }
  g.save(); g.beginPath(); g.arc(cx, cy, 460, 0, Math.PI * 2); g.clip(); g.putImageData(grain, 0, 0); g.restore();
  g.lineWidth = 3; g.strokeStyle = RING;
  g.beginPath(); g.arc(cx, cy, 330, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 6; g.beginPath(); g.arc(cx, cy, 442, 0, Math.PI * 2); g.stroke();
  // Beavy
  const h = 560, w = h * img.width / img.height;
  g.drawImage(img, cx - w / 2, cy - h / 2 + 40, w, h);
  // name over the top, tagline under
  arcText("BEAVY’S DAY OUT", 385, 200, 340, INK, 78, false);
  arcText("FREE & CHEAP FUN", 385, 30, 150, RED, 58, true);
  const dy = cy + Math.sin(Math.PI * 0.5) * 385;
  diamond(cx - 330, dy - 140, 9, RED); diamond(cx + 330, dy - 140, 9, RED);
  window.iconData = c.toDataURL("image/png");
  document.getElementById("status").textContent = "Done";
}
draw().catch(e => { document.getElementById("status").textContent = "Error: " + e.message; });
</script>
</body></html>
